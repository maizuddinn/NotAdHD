<style>
:root{--font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;--mono:"Cascadia Mono",Consolas,"SF Mono",ui-monospace,Menlo,monospace}
.app,body{--bg:#f3f4f7;--bar:#e6e9ef;--rail:#eceef3;--paper:#fff;--ink:#14171c;--ink2:#3a424d;--mute:#5a6472;--line:#dfe3ea;--line2:#cfd5df;--chip:#f3f4f7;--accent:#1f3fd8;--accent-ink:#fff;--soft:#e4e9fb;--soft-ink:#1a34b0;--code:#f6f7f9;--code-ink:#1c2127;--kw:#1f3fd8;--st:#b4460f;--cm:#5a6472;--hit:#ffe27a;--cur:#ff9f0a;--cur-ink:#14171c;--btn:#fff;--btn-hover:#eef1f6;--warn-bg:#fff1d6;--warn-ink:#7a4a00;--ok-bg:#e8f4ec;--ok-ink:#14602f;--bad-bg:#fdecea;--bad-ink:#8a1c14;--shadow:0 12px 32px rgba(20,23,28,.16);--overlay:rgba(20,23,28,.45)}
body.dark{--bg:#12151a;--bar:#1a1e25;--rail:#171b21;--paper:#1d2229;--ink:#e8ebf0;--ink2:#c4cad4;--mute:#98a2b0;--line:#2c333d;--line2:#3a424e;--chip:#262c35;--accent:#7d97ff;--accent-ink:#0f1320;--soft:#26325f;--soft-ink:#c9d4ff;--code:#151920;--code-ink:#e2e6ec;--kw:#93a9ff;--st:#f0a36a;--cm:#8c97a6;--hit:#6b5a12;--cur:#a85200;--cur-ink:#fff;--btn:#262c35;--btn-hover:#303743;--warn-bg:#4a3410;--warn-ink:#f5c36b;--ok-bg:#16301f;--ok-ink:#8fdcab;--bad-bg:#3a1a17;--bad-ink:#f3a59d;--shadow:0 12px 32px rgba(0,0,0,.5);--overlay:rgba(0,0,0,.6)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--bg);font-size:14px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
input::placeholder,textarea::placeholder{color:var(--mute)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hidden{display:none!important}
.i{display:inline-flex;flex:none}
.i svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#app{display:flex;flex-direction:column;height:100vh}
.mono{font-family:var(--mono)}
kbd{font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:5px;background:var(--chip);color:var(--ink2);border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--line2);border-radius:8px;background:var(--btn);font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--btn-hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn.flat{border-color:transparent;background:var(--chip)}
.btn.soft{border-color:transparent;background:var(--soft);color:var(--soft-ink)}
.btn.danger{color:var(--bad-ink)}
.btn:disabled{opacity:.5;cursor:default}
.tb{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:0;border-radius:8px;background:transparent;color:var(--ink2);flex:none}
.tb:hover{background:var(--btn-hover)}
.tb.on{background:var(--ink);color:var(--paper)}
.tb:disabled{opacity:.4;cursor:default}
.sep{width:1px;height:22px;background:var(--line);margin:0 6px;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:12px;background:var(--chip);border:1px solid var(--line);font-size:12px;color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip.soft{background:var(--soft);color:var(--soft-ink);border-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.seg{display:flex;gap:2px;padding:2px;background:var(--chip);border-radius:8px;border:1px solid var(--line)}
.seg button{height:24px;padding:0 10px;border:0;border-radius:6px;background:transparent;font-size:12px;color:var(--ink2)}
.seg button.on{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.tgl{width:38px;height:22px;border-radius:11px;background:var(--accent);position:relative;flex:none;border:0;padding:0}
.tgl i{position:absolute;right:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff}
.tgl.off{background:#8a93a0}
.tgl.off i{right:auto;left:3px}
.fld{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--line2);border-radius:9px;background:var(--bg);font-size:14px}
.fld input{border:0;outline:0;background:transparent;width:100%}
.lab{font-size:12px;font-weight:600;color:var(--mute)}
.note{font-size:12px;line-height:1.5;color:var(--ink2);background:var(--chip);border-radius:10px;padding:10px 12px}
.note.warn{background:var(--warn-bg);color:var(--warn-ink)}
/* top bar */
#topbar{height:48px;flex:none;display:flex;align-items:flex-end;padding:0 14px;background:var(--bar);border-bottom:1px solid var(--line);gap:0}
#logo{display:flex;align-items:center;gap:8px;height:48px;padding-right:18px;font-weight:700;font-size:15px;letter-spacing:-.01em}
#logo b{width:30px;height:30px;flex:none;display:flex;align-items:center;justify-content:center;line-height:0}
#logo b svg{width:30px;height:30px;display:block}
#logo>span{white-space:nowrap}
#tabs{display:flex;align-items:flex-end;min-width:0;overflow:hidden}
.tab{display:flex;align-items:center;gap:8px;height:36px;padding:0 6px 0 12px;border:0;border-radius:10px 10px 0 0;background:transparent;font-size:13px;color:var(--ink2);max-width:210px;min-width:60px}
.tab span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab.on{background:var(--paper);color:var(--ink);font-weight:600}
.tab .x{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;flex:none}
.tab .x:hover{background:var(--btn-hover)}
#topright{display:flex;align-items:center;gap:8px;height:48px;margin-left:auto;padding-left:10px}
#pbtn{display:flex;align-items:center;gap:8px;width:250px;height:32px;padding:0 10px;border:1px solid var(--line2);border-radius:8px;background:var(--btn);font-size:13px;color:var(--mute)}
#fmtbar{height:46px;flex:none;display:flex;align-items:center;gap:2px;padding:0 14px;background:var(--paper);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden}
#fmtbar::-webkit-scrollbar{height:0}
#fmtbar .tb{font-size:15px}
#mainrow{flex:1;min-height:0;display:flex}
/* rail */
#rail{width:264px;flex:none;background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#rail.collapsed{width:56px;align-items:center;padding:10px 0;gap:4px}
#rail .rtop{padding:12px 10px 6px;display:flex;flex-direction:column;gap:8px}
#rail .rlist{flex:1;overflow:auto;padding:0 8px 8px;min-height:0}
#rail .sec{font-size:12px;font-weight:600;color:var(--mute);padding:14px 10px 6px}
.rl{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border:0;border-radius:8px;background:transparent;width:100%;text-align:left;font-size:13.5px;color:var(--ink2)}
.rl:hover{background:var(--btn-hover)}
.rl .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.rl.on{background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.1),0 0 0 1px var(--line);font-weight:600;color:var(--ink)}
.rl .cnt{margin-left:auto;font-size:12px;color:var(--mute);font-weight:400}
.rl.rn{height:auto;min-height:32px;padding:6px 10px;flex-direction:column;align-items:flex-start;gap:0;background:transparent;color:var(--ink2);border-radius:8px}
.rl.rn .s{font-size:11.5px;color:var(--mute)}
#rail .rbot{padding:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.tb.rl2{width:40px;height:40px;border-radius:10px}
.tb.rl2.on{background:var(--paper);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;padding:0 6px}
.tagrow .chip{cursor:pointer}
/* library view */
#libview{flex:1;min-width:0;overflow:auto;padding:28px 36px 40px}
#libview .ltop{display:flex;align-items:center;gap:12px}
#libview .lq{display:flex;align-items:center;gap:10px;flex:1;height:44px;padding:0 14px;background:var(--paper);border:1px solid var(--line2);border-radius:12px;color:var(--mute)}
#libview .lq input{border:0;outline:0;background:transparent;font-size:16px;width:100%;color:var(--ink)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:16px}
.lgrid.list{grid-template-columns:1fr}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0}
.card:hover{border-color:var(--line2);box-shadow:0 4px 14px rgba(0,0,0,.08)}
.card .prev{height:124px;background:var(--chip);border-bottom:1px solid var(--line);padding:14px 16px;position:relative;overflow:hidden}
.card .prev .ln{height:6px;border-radius:3px;background:var(--line2);margin-bottom:9px}
.card .prev img{position:absolute;right:12px;bottom:10px;width:110px;height:64px;object-fit:cover;border:1px solid var(--line2);border-radius:6px;background:#fff}
.card .cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.card .ct{font-weight:600;font-size:15px;line-height:1.3}
.card .cm2{font-size:12px;color:var(--mute)}
.card .sn{font-family:var(--mono);font-size:12px;line-height:1.5;color:var(--ink2);background:var(--chip);border-radius:8px;padding:6px 8px;overflow:hidden;max-height:60px}
.lgrid.list .card{flex-direction:row}
.lgrid.list .card .prev{display:none}
mark.fm,.sn mark{background:var(--hit);color:inherit;border-radius:3px;padding:0 2px}
/* note view */
#noteview{flex:1;min-width:0;position:relative;display:flex;background:var(--bg)}
#title{display:block;width:100%;border:0;outline:0;background:transparent;font:700 32px/1.2 var(--font);letter-spacing:-.02em;color:var(--ink);padding:0}
#meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:12px;font-size:13px;color:var(--mute)}
#meta select{height:24px;border:1px solid var(--line);border-radius:12px;background:var(--chip);color:var(--ink2);font-size:12px;padding:0 8px}
#meta .tagin{border:0;outline:0;background:transparent;width:110px;font-size:12px;color:var(--ink)}
.ol{display:block;padding:5px 10px;font-size:13px;color:var(--ink2);border-radius:6px;text-align:left;border:0;background:transparent;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ol:hover{background:var(--btn-hover)}
.ol.l2{padding-left:20px}
.ol.l3{padding-left:30px}
.blcard{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);text-align:left;font-size:12px;line-height:1.45;color:var(--ink2);width:100%;margin-bottom:6px}
.blcard b{display:block;font-size:13px;color:var(--ink)}
/* code block */
.code{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--code);margin:8px 0}
.chead{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 10px 0 14px;border-bottom:1px solid var(--line);background:var(--chip);flex-wrap:wrap}
.chead select,.chead input.cname{height:24px;border:1px solid transparent;border-radius:6px;background:transparent;font-size:12px;color:var(--ink2);padding:0 4px}
.chead input.cname{font-family:var(--mono);width:150px}
.chead select:hover,.chead input.cname:hover{border-color:var(--line2)}
.chead .btn{height:24px;padding:0 8px;font-size:12px;border-color:transparent;background:transparent}
.chead .btn.on{background:var(--soft);color:var(--soft-ink)}
.cbody{display:flex;padding:10px 0;font-family:var(--mono);font-size:13.5px;line-height:22px;color:var(--code-ink);tab-size:4}
.cln{width:46px;flex:none;text-align:right;padding-right:12px;color:var(--mute);border-right:1px solid var(--line);margin-right:14px;white-space:pre;user-select:none}
.cedit{flex:1;min-width:0;overflow-x:auto}
.cinner{position:relative;display:inline-block;min-width:100%}
.cback,.cin{margin:0;padding:0 14px 0 0;border:0;font:inherit;line-height:inherit;letter-spacing:0;tab-size:4;white-space:pre;word-break:normal;overflow-wrap:normal}
.cback{display:block;pointer-events:none;color:var(--code-ink)}
.cin{position:absolute;inset:0;width:100%;height:100%;resize:none;overflow:hidden;background:transparent;color:transparent;caret-color:var(--code-ink);outline:0}
.cin::selection{background:rgba(31,63,216,.28);color:transparent}
.code.wrap .cback,.code.wrap .cin{white-space:pre-wrap;word-break:break-word}
.code.wrap .cln{display:none}
.code.wrap .cbody{padding-left:14px}
.kw{color:var(--kw);font-weight:500}
.st{color:var(--st)}
.cm{color:var(--cm);font-style:italic}
.nu{color:#7a3ab0}
body.dark .nu{color:#c79bf0}
.cback mark{background:var(--hit);color:inherit}
.cback mark.cur{background:var(--cur);color:var(--cur-ink)}
::highlight(find){background-color:var(--hit);color:inherit}
::highlight(find-cur){background-color:var(--cur);color:var(--cur-ink)}
.dbar{display:flex;flex-wrap:wrap;gap:3px;align-items:center;padding:6px;background:var(--chip);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;position:sticky;top:-8px;z-index:6}
.dbar .tb.on{background:var(--accent);color:var(--accent-ink)}
.sw{width:20px;height:20px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line2);padding:0;flex:none}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.dbar input[type=color]{width:26px;height:24px;padding:0;border:1px solid var(--line2);border-radius:5px;background:none}
.dbar input[type=range]{width:80px}
.layer{display:flex;align-items:center;gap:8px;height:30px;padding:0 6px 0 8px;border-radius:7px;font-size:13px;color:var(--ink2);cursor:pointer;border:0;background:transparent;width:100%;text-align:left}
.layer.on{background:var(--soft);color:var(--soft-ink);font-weight:600}
.layer .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer .tb{width:24px;height:24px}
.fc .info{min-width:0;flex:1}
.ftype{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700;flex:none}
.fn{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fm{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px;margin-top:1px}
.bd{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:9px;background:var(--soft);color:var(--soft-ink);font-size:11px;font-weight:600}
.bd.warn{background:var(--warn-bg);color:var(--warn-ink)}
.twrap{overflow-x:auto}
table.tbl{border-collapse:collapse;min-width:60%;width:100%}
.tbl td,.tbl th{border:1px solid var(--line2);padding:8px 12px;font-size:14px;vertical-align:top;min-width:80px}
.tbl th{background:var(--chip);font-weight:700;text-align:left}
.tcell{outline:0;min-height:1.4em;white-space:pre-wrap}
.tbl td:focus-within,.tbl th:focus-within{outline:2px solid var(--accent);outline-offset:-2px;background:var(--soft)}
/* menus, dialogs */
.menu{position:fixed;z-index:200;min-width:200px;max-width:320px;max-height:70vh;overflow:auto;background:var(--paper);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);padding:6px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 10px;border:0;border-radius:8px;background:transparent;text-align:left;font-size:13px;color:var(--ink)}
.menu button:hover,.menu button.on{background:var(--btn-hover)}
.menu .sub{font-size:12px;color:var(--mute);padding:6px 10px 2px;font-weight:600}
.menu .msep{height:1px;background:var(--line);margin:4px 2px}
.mbg{position:fixed;inset:0;z-index:150;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:20px}
.dlg{background:var(--paper);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.3);max-height:calc(100vh - 40px);overflow:auto;width:560px;max-width:100%}
.dh{display:flex;align-items:flex-start;justify-content:space-between;padding:20px 24px 12px;gap:12px}
.dh h2{margin:0;font-size:20px;letter-spacing:-.01em}
.dh .sub{font-size:13px;color:var(--mute);margin-top:2px}
.db{padding:0 24px;display:flex;flex-direction:column;gap:14px}
.df{display:flex;align-items:center;gap:10px;padding:18px 24px 20px}
.df .sp{flex:1}
.fmtgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fmt{display:flex;flex-direction:column;gap:4px;text-align:left;padding:12px 14px;border:1px solid var(--line2);border-radius:12px;background:var(--paper)}
.fmt.on{border:2px solid var(--accent);padding:11px 13px;background:var(--soft)}
.fmt b{font-size:14px}
.fmt span{font-size:12px;line-height:1.4;color:var(--ink2)}
.opt{display:flex;align-items:flex-start;gap:10px;font-size:14px;line-height:1.35;cursor:pointer}
.opt input{margin:2px 0 0;width:16px;height:16px;accent-color:var(--accent)}
.opt small{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.rowx{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.pal{width:600px;max-width:100%;align-self:flex-start;margin-top:12vh}
.pal .pin{display:flex;align-items:center;gap:12px;height:56px;padding:0 18px;border-bottom:1px solid var(--line)}
.pal .pin input{border:0;outline:0;background:transparent;font-size:17px;width:100%}
.pal .prow{display:flex;align-items:center;gap:12px;width:100%;height:42px;padding:0 12px;border:0;border-radius:10px;background:transparent;text-align:left;font-size:14px;color:var(--ink2)}
.pal .prow.on{background:var(--accent);color:var(--accent-ink)}
.pal .prow .k{margin-left:auto;font-size:12px;opacity:.85}
.pal .grp{font-size:12px;font-weight:600;color:var(--mute);padding:10px 12px 4px}
.hist{display:flex;align-items:center;gap:10px;min-height:34px;padding:5px 10px;border-radius:9px;font-size:13px;line-height:1.35;color:var(--ink2);border:0;background:transparent;width:100%;text-align:left}
.hist:hover{background:var(--btn-hover)}
.hist .d{width:10px;height:10px;border-radius:50%;border:2px solid var(--mute);background:var(--paper);flex:none}
.hist .t{margin-left:auto;font-size:12px;color:var(--mute);white-space:nowrap}
.hist.cur{background:var(--soft);font-weight:600;color:var(--ink)}
.hist.cur .d{background:var(--accent);border-color:var(--accent)}
.hist.redo{opacity:.7}
.hist.redo .d{border-style:dashed}
.mk2{display:flex;align-items:center;gap:8px;height:26px;padding:0 10px;margin:2px 0;border-radius:8px;background:var(--ok-bg);color:var(--ok-ink);font-size:12px;font-weight:600}
.mk2.man{background:var(--soft);color:var(--soft-ink)}
.mk2 .t{margin-left:auto;font-weight:500;opacity:.85}
.diff{font-family:var(--mono);font-size:13px}
.drow{display:flex;min-height:24px;line-height:24px;white-space:pre-wrap;word-break:break-word}
.drow .s{width:24px;text-align:center;font-weight:700;flex:none}
.drow.add{background:var(--ok-bg);color:var(--ok-ink)}
.drow.del{background:var(--bad-bg);color:var(--bad-ink)}
.dsec{padding:8px 12px;background:var(--chip);border-top:1px solid var(--line);border-bottom:1px solid var(--line);font:700 12px var(--font);color:var(--ink2)}
.tplgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tpl{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper);text-align:left;padding:0}
.tpl.on{border:2px solid var(--accent)}
.tpl .pv{height:96px;background:var(--chip);border-bottom:1px solid var(--line);padding:14px 16px}
.tpl .pv i{display:block;height:6px;border-radius:3px;background:var(--line2);margin-bottom:8px}
.tpl .tx{padding:10px 14px 12px}
.tpl .tx b{display:block;font-size:14px}
.tpl .tx span{font-size:12px;color:var(--mute);line-height:1.4}
#toasts{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#14171c;color:#e8ebf0;border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.4);font-size:13px;max-width:92vw}
.toast b{display:block;font-size:14px}
.toast small{display:block;color:#c4cad4;margin-top:2px}
.toast .ok{width:30px;height:30px;border-radius:50%;background:#2fa65a;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.toast button{height:28px;padding:0 10px;border:1px solid #3a424e;border-radius:8px;background:transparent;color:#e8ebf0;font-size:12px}
.toast button.p{background:#7d97ff;border-color:#7d97ff;color:#0f1320;font-weight:700}
/* find */
#findbar{position:absolute;top:30px;right:250px;width:470px;z-index:30;background:var(--paper);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);padding:8px;display:flex;flex-direction:column;gap:6px}
#findbar .r{display:flex;align-items:center;gap:6px}
#findbar .fld{height:34px;flex:1}
#findbar .fld.f1{border:2px solid var(--accent)}
/* status */
#status{height:32px;flex:none;display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--bar);border-top:1px solid var(--line);font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden}
#status .sp{margin-left:auto}
#status button.lk{border:0;background:transparent;font-size:12px;color:var(--ink2);padding:2px 6px;border-radius:6px;display:flex;align-items:center;gap:6px}
#status button.lk:hover{background:var(--btn-hover)}
#status .seg button{height:20px}
/* capture overlay */
#capov{position:fixed;inset:0;z-index:300;background:#0e1014;display:flex;flex-direction:column}
#capov .ctop{display:flex;align-items:center;justify-content:center;gap:12px;padding:10px;flex-wrap:wrap;color:#e8ebf0;font-size:13px}
#capov .cbar{display:flex;align-items:center;gap:12px;padding:8px 10px;background:#14171c;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.4);flex-wrap:wrap;justify-content:center}
#capov .cseg{display:flex;gap:2px;padding:3px;background:#262c35;border-radius:9px}
#capov .cseg button{height:28px;padding:0 12px;border:0;border-radius:7px;background:transparent;color:#e8ebf0;font-size:13px}
#capov .cseg button.on{background:#fff;color:#14171c;font-weight:600}
#capov .cbtn{height:32px;padding:0 12px;border:1px solid #3a424e;border-radius:8px;background:transparent;color:#e8ebf0}
#capov .cbtn.p{background:#7d97ff;border-color:#7d97ff;color:#0f1320;font-weight:700}
#capov .cstage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
#capov .dbar{background:#14171c;border-color:#262c35;color:#e8ebf0;margin:0;position:static}
#capov .dbar .tb{color:#e8ebf0}
#capov .dbar .tb:hover{background:#262c35}
#capov .dbar .tb.on{background:#7d97ff;color:#0f1320}
#capov .dbar .sw{border-color:#14171c}
#capov .dbar .sw.on{box-shadow:0 0 0 2px #fff}
#capov .hint{color:#c4cad4;font-size:12px;padding:6px 10px}
#cdelay{position:fixed;inset:0;z-index:310;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);color:#fff;font-size:96px;font-weight:700;pointer-events:none}
.menu .ic{color:var(--mute);display:flex}
.df{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
/* ===== v2 layout ===== */
#topwrap{flex:none}
body.topc #topwrap{display:none}
#topshow{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:60;display:none;align-items:center;gap:6px;height:26px;padding:0 14px;border:1px solid var(--line2);border-top:0;border-radius:0 0 12px 12px;background:var(--bar);font-size:12px;color:var(--ink2);box-shadow:0 4px 12px rgba(0,0,0,.12)}
body.topc #topshow{display:flex}
body.focus #topshow{display:none}
#exitfocus{display:none;position:fixed;top:12px;right:16px;z-index:60;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid var(--line2);border-radius:15px;background:var(--bar);font-size:12px;color:var(--ink2);box-shadow:0 4px 12px rgba(0,0,0,.14);opacity:.7}
#exitfocus:hover{opacity:1}
body.focus #exitfocus{display:flex}
body.focus #rail,body.focus #aside,body.focus #status{display:none!important}
main{flex:1;min-width:0;display:flex;position:relative}
#noteview{flex:1;min-width:0;min-height:0;display:flex;background:var(--bg)}
#canvascol{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
#canvas{flex:1;min-height:0;overflow:auto;background:var(--paper);position:relative}
#zwrap{position:relative}
#sheet{position:absolute;left:0;top:0;transform-origin:0 0;padding:28px 40px;box-sizing:border-box}
#textcol{position:relative;max-width:100%}
#objlayer{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none}
/* ===== the continuous text surface ===== */
#editor{min-height:calc(100vh - 300px);outline:none;white-space:pre-wrap;overflow-wrap:anywhere;tab-size:4;font-family:var(--mono);font-size:15px;line-height:var(--lh,1.65);color:var(--ink);caret-color:var(--accent);padding:14px 2px 240px}
body[data-font=sans] #editor{font-family:var(--font);font-size:16.5px}
#editor h1,#editor h2,#editor h3{font-family:var(--font);margin:.9em 0 .25em;line-height:1.25;letter-spacing:-.01em}
#editor h1{font-size:28px}#editor h2{font-size:22px}#editor h3{font-size:18px}
#editor ul,#editor ol{margin:2px 0;padding-left:30px}
#editor ul{list-style:disc}#editor ul ul{list-style:circle}#editor ul ul ul{list-style:square}
#editor ol{list-style:decimal}#editor ol ol{list-style:lower-alpha}#editor ol ol ol{list-style:lower-roman}
#editor li{padding-left:2px}
#editor li[data-c]{list-style:none;position:relative}
#editor li[data-c]::before{content:'';position:absolute;left:-26px;top:.42em;width:16px;height:16px;border:2px solid var(--mute);border-radius:4px;background:var(--paper);cursor:pointer;box-sizing:border-box}
#editor li[data-c="1"]::before{background:var(--accent) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'><path d='M5 12l5 5 9-10'/></svg>") center/12px no-repeat;border-color:var(--accent)}
#editor li[data-c="1"]{color:var(--mute);text-decoration:line-through}
#editor hr{border:0;border-top:1px solid var(--line2);margin:14px 0}
#editor code,.stxt code,.tcell code{font-family:var(--mono);font-size:.92em;background:var(--chip);padding:1px 5px;border-radius:5px}
#editor mark,.stxt mark,.tcell mark{background:var(--hit);color:inherit;border-radius:3px;padding:0 1px}
#editor a.nl,.tcell a.nl{background:var(--soft);color:var(--soft-ink);border-radius:5px;padding:0 6px;cursor:pointer;text-decoration:none;font-family:var(--font);font-size:.95em}
::selection{background:color-mix(in srgb,var(--accent) 32%,transparent)}
/* ===== floating objects ===== */
.obj{pointer-events:auto;position:absolute;box-sizing:border-box}
.obj.sel{outline:2px solid var(--accent);outline-offset:3px}
.obj.locked.sel{outline-style:dashed}
.obj .hnd{position:absolute;width:11px;height:11px;background:var(--paper);border:2px solid var(--accent);border-radius:3px;display:none;z-index:6;box-sizing:border-box}
.obj.sel .hnd{display:block}
.hnd.nw{left:-9px;top:-9px;cursor:nwse-resize}.hnd.n{left:calc(50% - 5px);top:-9px;cursor:ns-resize}.hnd.ne{right:-9px;top:-9px;cursor:nesw-resize}.hnd.e{right:-9px;top:calc(50% - 5px);cursor:ew-resize}.hnd.se{right:-9px;bottom:-9px;cursor:nwse-resize}.hnd.s{left:calc(50% - 5px);bottom:-9px;cursor:ns-resize}.hnd.sw{left:-9px;bottom:-9px;cursor:nesw-resize}.hnd.w{left:-9px;top:calc(50% - 5px);cursor:ew-resize}
.lockbadge{position:absolute;right:6px;top:6px;display:none;color:var(--ink2);z-index:7}
.obj.locked.sel .lockbadge{display:flex}
.ogrip{position:absolute;left:0;right:0;top:-24px;height:24px;display:none;align-items:center;justify-content:center;cursor:move;background:var(--accent);color:var(--accent-ink);border-radius:8px 8px 0 0;z-index:5}
.obj.sel .ogrip,.obj:hover .ogrip{display:flex}
.obj.locked .ogrip{cursor:default}
.obj.sticky,.obj.image,.obj.file{cursor:move}
.obj.locked{cursor:default}
.sbox{width:100%;height:100%;padding:16px 18px;box-sizing:border-box;position:relative;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden;word-break:break-word}
.sbox.middle{justify-content:center}.sbox.bottom{justify-content:flex-end}
.stxt{outline:none;white-space:pre-wrap;min-height:1.2em;cursor:inherit;user-select:none}
.stxt[contenteditable=true]{cursor:text;user-select:text}
.stxt:empty::before{content:attr(data-ph);opacity:.45}
.deco.pin{position:absolute;top:8px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#e11d48;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.deco.tape{position:absolute;top:0;left:50%;width:70px;height:20px;margin-left:-35px;background:rgba(255,255,255,.55);border:1px solid rgba(0,0,0,.12)}
.deco.clip{position:absolute;top:0;right:10px;color:#6b7782}
.imgbox{position:relative;width:100%;height:100%}
.imgbox canvas{display:block;width:100%;height:100%;box-shadow:0 0 0 1px var(--line2),0 3px 10px rgba(20,23,28,.15);background:#fff}
.obj.editing .imgbox canvas{cursor:crosshair}
.obj.editing{cursor:default}
.ocap{position:absolute;top:100%;left:0;right:0;font-size:12px;color:var(--mute);margin-top:5px}
.obj.editing .dbar{position:absolute;bottom:100%;left:0;margin-bottom:10px;z-index:12;width:max-content;max-width:min(680px,90vw);top:auto}
.fbox{--sc:1;width:100%;height:100%;background:var(--paper);border:1px solid var(--line2);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 2px 8px rgba(20,23,28,.12)}
.fhead{display:flex;align-items:center;gap:10px;padding:8px 10px;flex:none}
.fhead .info{flex:1;min-width:0}
.fbox .ftype{width:calc(38px*var(--sc));height:calc(38px*var(--sc));font-size:calc(10px*var(--sc))}
.fbox .fn{font-size:calc(13px*var(--sc))}
.fbox .fm{font-size:calc(12px*var(--sc))}
.fprev{flex:1;min-height:0;overflow:auto;border-top:1px solid var(--line);background:var(--chip);display:flex}
.fprev img{width:100%;height:auto;display:block;align-self:flex-start}
.fprev embed{width:100%;height:100%;min-height:200px;border:0}
.fprev pre{margin:0;padding:10px;font:12.5px/1.5 var(--mono);white-space:pre-wrap;color:var(--ink);width:100%}
.fnoprev{padding:16px;color:var(--mute);font-size:13px}
.otbl{position:relative;width:100%;background:var(--paper);border-radius:6px;box-shadow:0 0 0 1px var(--line2),0 3px 12px rgba(20,23,28,.12)}
.ttools{position:absolute;bottom:100%;left:0;margin-bottom:30px;display:none;gap:4px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line2);border-radius:10px;padding:5px;box-shadow:var(--shadow);width:max-content;max-width:620px;z-index:12}
.obj.sel .ttools{display:flex}
.twrap{overflow:auto;border-radius:6px}
.obj.code .code{height:100%;margin:0;display:flex;flex-direction:column;box-shadow:0 3px 12px rgba(20,23,28,.12)}
.obj.code .cbody{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;align-items:flex-start}
.obj.code .cln{align-self:stretch}
.dangerbtn{background:#d92d20!important;border-color:#d92d20!important;color:#fff!important}
/* ===== left pane tree ===== */
#rail{width:290px;flex:none;display:flex;flex-direction:column;background:var(--rail);border-right:1px solid var(--line)}
.trow{display:flex;align-items:center;gap:6px;height:30px;padding-right:8px;border-radius:7px;font-size:13.5px;color:var(--ink2);cursor:pointer;user-select:none}
.trow:hover{background:var(--btn-hover)}
.trow.on{background:var(--soft);color:var(--soft-ink);font-weight:600}
.trow .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .tw{width:16px;height:16px;flex:none;border:0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0;color:var(--mute);border-radius:4px}
.trow .tw.sp{pointer-events:none}
.trow .tw svg{transition:transform .12s}
.trow .tw.open svg{transform:rotate(90deg)}
.trow .ti{display:flex;flex:none}
.trow .cnt,.rl .cnt{font-size:11px;color:var(--mute);flex:none}
.trow .pn{color:#d97706;display:flex;flex:none}

.gtext li[data-c="1"]::before{background:var(--accent) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'><path d='M5 12l5 5 9-10'/></svg>") center/12px no-repeat;border-color:var(--accent)}
.gtext li[data-c="1"]{color:var(--mute);text-decoration:line-through}
.gtext hr{border:0;border-top:1px solid var(--line2);margin:14px 0}
.gtext code,.stxt code,.tcell code{font-family:var(--mono);font-size:.92em;background:var(--chip);padding:1px 5px;border-radius:5px}
.gtext mark,.stxt mark,.tcell mark{background:var(--hit);color:inherit;border-radius:3px;padding:0 1px}
.gtext a.nl,.tcell a.nl{background:var(--soft);color:var(--soft-ink);border-radius:5px;padding:0 6px;cursor:pointer;text-decoration:none;font-family:var(--font);font-size:.95em}
.gtext>div,.gtext li{margin-bottom:var(--pg,0px)}
.gtext h1,.gtext h2,.gtext h3{font-family:var(--hf,var(--font))}
.gtext h1{font-size:1.87em}.gtext h2{font-size:1.47em}.gtext h3{font-size:1.2em}
.gtext a.wl,.txt a.wl{color:var(--accent);text-decoration:underline;text-underline-offset:2px;cursor:pointer}

/* ===== phase 2: save folder, banner, version ===== */
.ver{font-size:10px;font-weight:600;color:var(--mute);margin-left:6px;letter-spacing:0;vertical-align:2px}
#savebar{display:flex;align-items:center;gap:10px;padding:7px 14px;font-size:13px;line-height:1.35;background:var(--warn-bg,#fff1cf);color:var(--warn-ink,#6a4700);border-bottom:1px solid rgba(0,0,0,.09);flex:none}
#savebar.err{background:#fde7e7;color:#8a1c1c}
body.dark #savebar{background:#3a2f12;color:#f3d58a}
body.dark #savebar.err{background:#40181a;color:#ffb3b3}
#savebar .m{flex:1;min-width:0}
#savebar button{height:28px;padding:0 12px;border-radius:8px;border:1px solid rgba(0,0,0,.18);background:rgba(255,255,255,.75);color:inherit;font-weight:600;font-size:12.5px;white-space:nowrap}
#savebar button.x{width:28px;padding:0;font-weight:400;border-color:transparent;background:transparent}
#savebar button:hover{background:rgba(255,255,255,1)}
.prog{height:8px;border-radius:5px;background:var(--chip);overflow:hidden;margin:10px 0 6px}
.prog>i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}

/* ===== phase 3: multi-select, groups, align ===== */
.obj.msel{outline:2px solid var(--accent);outline-offset:3px}
.obj.msel.locked{outline-style:dashed}
#gbox{position:absolute;pointer-events:none;border:1.5px dashed var(--accent);border-radius:7px;z-index:99998;box-sizing:border-box}
#gbox .glab{position:absolute;left:-1px;top:-22px;height:18px;padding:0 8px;border-radius:9px 9px 9px 2px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;line-height:18px;white-space:nowrap}
.rband{position:fixed;z-index:9999;border:1.5px solid var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:3px;pointer-events:none}
body.banding,body.banding *{user-select:none!important}
</style>

/* ---- locking a photo reserves text space for it ---- */
function spaceEl(id){const ed=EDI();return ed?ed.querySelector('.imgsp[data-for="'+id+'"]'):null;}

function reserveSpace(o){if(o.t!=='image'||o.fx)return;const ed=EDI(),tc=$('#textcol');if(!ed||!tc||!S.cur||ed.dataset.nid!==S.cur.id)return;
  const old=spaceEl(o.id);if(old)old.remove();removeMarker(o.id);
  const l=tc.offsetLeft,r=l+tc.offsetWidth;if(o.x+o.w<=l+4||o.x>=r-4){delete o.sp;anchorObject(o);return;}
  const el=elOf(o.id);const hgt=Math.round((el?Math.max(el.offsetHeight,el.scrollHeight):Math.round(o.w*o.nh/o.nw))+12);
  const Z=S.settings.zoom/100,sr=sheetRect();const blocks=[...ed.children].filter(b=>!b.classList.contains('imgsp'));
  let before=null,after=null;for(const b of blocks){const rc=b.getBoundingClientRect();const top=(rc.top-sr.top)/Z,bot=(rc.bottom-sr.top)/Z;
    if(bot>o.y+4){const pick=Math.abs(top-o.y)<=Math.abs(bot-o.y)?'before':'after';if(pick==='before')before=b;else after=b;break;}}
  const sp=h('div',{class:'imgsp','data-for':o.id,contenteditable:'false',style:'height:'+hgt+'px'});
  const mk=document.createElement('span');mk.className='anc';mk.dataset.anc=o.id;mk.contentEditable='false';sp.append(mk);
  if(before)before.before(sp);else if(after)after.after(sp);else{if(!blocks.length){delete o.sp;return;}blocks[blocks.length-1].after(sp);}

/* ================= PHASE 3: multi-select, groups, align ================= */
S.msel=[];let mdrag=null;

const selObjs=()=>selIdsNow().map(OBJ).filter(Boolean);
function groupOf(o){if(!o||!o.g||!S.cur)return o?[o]:[];const ms=S.cur.objs.filter(x=>x.g===o.g);if(ms.length<2){delete o.g;return [o];}return ms;}
function cleanGroups(){if(!S.cur)return;const c={};S.cur.objs.forEach(o=>{if(o.g)c[o.g]=(c[o.g]||0)+1;});S.cur.objs.forEach(o=>{if(o.g&&c[o.g]<2)delete o.g;});}
function boxOf(o){const el=elOf(o.id);return{x:o.x,y:o.y,w:el?el.offsetWidth:o.w,h:el?el.offsetHeight:(o.h||0)};}
function paintMsel(){const lay=$('#objlayer');if(!lay)return;

  const gb=h('div',{id:'gbox',style:'left:'+(x0-8)+'px;top:'+(y0-8)+'px;width:'+(x1-x0+16)+'px;height:'+(y1-y0+16)+'px'},h('span',{class:'glab'},(one?'Group · ':'')+ms.length+(one?'':' selected')));lay.append(gb);}
function selectIds(ids){ids=[...new Set(ids)].filter(id=>OBJ(id));if(!ids.length){deselect();return;}if(ids.length===1){selectObj(ids[0]);return;}const a=document.activeElement;if(a&&a!==document.body&&isEditable(a))a.blur();S.msel=ids;S.osel=null;markSel();}
function expandGroups(ids){const out=new Set(ids);ids.forEach(id=>{const o=OBJ(id);if(o&&o.g)groupOf(o).forEach(x=>out.add(x.id));});return [...out];}
function toggleInSel(o){const cur=selIdsNow();const mem=groupOf(o).map(x=>x.id);const all=mem.every(id=>cur.includes(id));selectIds(all?cur.filter(id=>!mem.includes(id)):cur.concat(mem));}

/* ---- click handling on objects ---- */
$('#sheet').addEventListener('pointerdown',e=>{if(e.button!==0||e.ctrlKey||e.metaKey||S.view!=='note'||!S.cur)return;
  const el=e.target.closest('.obj');if(!el)return;const o=OBJ(el.dataset.id);if(!o||e.target.closest('.hnd'))return;
  const editable=e.target.closest('.tcell,textarea,input,select,[contenteditable="true"]');
  if(e.shiftKey&&!editable){e.preventDefault();e.stopPropagation();toggleInSel(o);return;}
  if(e.altKey||S.editing===o.id)return;
  const inMulti=S.msel.includes(o.id);if(!inMulti&&!o.g)return;
  if(!canDragFrom(o,e))return;

  e.preventDefault();e.stopPropagation();startMultiDrag(e);},true);
function startMultiDrag(e){const objs=selObjs();if(objs.length<2)return;mdrag={objs,st:objs.map(o=>[o.x,o.y]),fa:objs.map(o=>o.fa),x0:e.clientX,y0:e.clientY,Z:S.settings.zoom/100,moved:false};}
document.addEventListener('pointermove',e=>{if(!mdrag)return;const d=mdrag;const dx=(e.clientX-d.x0)/d.Z,dy=(e.clientY-d.y0)/d.Z;if(!d.moved){if(Math.hypot(dx,dy)<3)return;d.moved=true;d.objs.forEach(o=>{if(!o.locked)o.fa=false;});}
  const cf=cfgOf(),sn=v=>cf.snap?Math.round(v/cf.gs)*cf.gs:Math.round(v);const mov=d.objs.map((o,i)=>[o,i]).filter(([o])=>!o.locked);if(!mov.length)return;
  let ddx=sn(dx),ddy=sn(dy);ddx=Math.max(ddx,-Math.min(...mov.map(([o,i])=>d.st[i][0])));ddy=Math.max(ddy,-Math.min(...mov.map(([o,i])=>d.st[i][1])));
  mov.forEach(([o,i])=>{o.x=d.st[i][0]+ddx;o.y=d.st[i][1]+ddy;const el=elOf(o.id);if(el)el.style.cssText=geom(o);});paintMsel();});

  mov.forEach(o=>gapMoved(o));mov.forEach(o=>anchorObject(o));layoutSheet();paintMsel();commit('Moved '+mov.length+' objects');}
document.addEventListener('pointerup',endMulti);document.addEventListener('pointercancel',endMulti);
/* ---- box select ---- */
(function(){const cv=$('#canvas');let rb=null,band=null,raf=0;
  const hits=()=>{const r=band.getBoundingClientRect(),out=[];$$('#objlayer .obj').forEach(el=>{const q=el.getBoundingClientRect();if(q.right>=r.left&&q.left<=r.right&&q.bottom>=r.top&&q.top<=r.bottom)out.push(el.dataset.id);});return expandGroups(out);};
  const paintLive=ids=>{S.msel=ids.length>1?ids:[];S.osel=ids.length===1?ids[0]:null;paintMsel();};
  const stop=()=>{if(band){band.remove();band=null;}document.body.classList.remove('banding');rb=null;};
  cv.addEventListener('pointerdown',e=>{rb=null;if(e.button!==0||e.ctrlKey||e.metaKey||S.view!=='note'||!S.cur)return;const t=e.target;
    const blankT=(t===cv||t.id==='zwrap'||t.id==='stack'||t.id==='sheet');const altOk=e.altKey&&!!t.closest('#sheet')&&!t.closest('.obj,#title,#meta,input,button,select,textarea');
    if(!blankT&&!altOk)return;const r=cv.getBoundingClientRect();if(e.clientX>r.left+cv.clientWidth||e.clientY>r.top+cv.clientHeight)return;
    rb={x0:e.clientX,y0:e.clientY,pre:e.shiftKey?selIdsNow():[],shift:e.shiftKey,on:false};},true);
  cv.addEventListener('mousedown',e=>{if(rb)e.preventDefault();},true);
  document.addEventListener('pointermove',e=>{if(!rb)return;const dx=e.clientX-rb.x0,dy=e.clientY-rb.y0;if(!rb.on){if(Math.hypot(dx,dy)<5)return;rb.on=true;band=h('div',{class:'rband'});document.body.append(band);document.body.classList.add('banding');}
    band.style.left=Math.min(rb.x0,e.clientX)+'px';band.style.top=Math.min(rb.y0,e.clientY)+'px';band.style.width=Math.abs(dx)+'px';band.style.height=Math.abs(dy)+'px';
    cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{if(band)paintLive([...new Set(rb?rb.pre.concat(hits()):[])]);});});
  document.addEventListener('pointerup',()=>{if(!rb)return;const was=rb;let ids=null;if(was.on&&band)ids=[...new Set(was.pre.concat(hits()))];stop();
    if(ids)selectIds(ids);else if(was.shift&&was.pre.length)selectIds(was.pre);});
  document.addEventListener('pointercancel',stop);})();
/* ---- keyboard ---- */
document.addEventListener('keydown',e=>{if(S.view!=='note'||!S.cur||$('#modals').children.length||document.getElementById('capov'))return;if(isEditable(e.target))return;
  const mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();const multi=S.msel.length>1;
  if(mod&&k==='g'){e.preventDefault();e.stopPropagation();if(e.shiftKey)ungroupSel();else groupSel();return;}
  if(!multi)return;
  if(e.key==='Escape'){e.preventDefault();e.stopPropagation();deselect();return;}
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();e.stopPropagation();deleteSel();return;}
  if(mod&&k==='d'){e.preventDefault();e.stopPropagation();dupSel();return;}
  if(e.key.startsWith('Arrow')&&!mod){e.preventDefault();e.stopPropagation();nudgeSel(e.key,e.shiftKey?10:1);}
},true);
function nudgeSel(key,st){const mov=selObjs().filter(o=>!o.locked);if(!mov.length)return;let dx=key==='ArrowLeft'?-st:key==='ArrowRight'?st:0,dy=key==='ArrowUp'?-st:key==='ArrowDown'?st:0;
  dx=Math.max(dx,-Math.min(...mov.map(o=>o.x)));dy=Math.max(dy,-Math.min(...mov.map(o=>o.y)));mov.forEach(o=>{o.x+=dx;o.y+=dy;const el=elOf(o.id);if(el)el.style.cssText=geom(o);gapMoved(o);anchorObject(o);});layoutSheet();paintMsel();commitSoon('Moved objects');}
/* ---- group / ungroup ---- */
function groupSel(){const objs=selObjs();if(objs.length<2){toast('Pick two or more objects first',{sub:'Shift+click each one, or drag a box around them.'});return;}
  const gid=uid();objs.forEach(o=>{o.g=gid;});cleanGroups();paintMsel();commit('Grouped '+objs.length+' objects');toast('Grouped '+objs.length+' objects',{ok:true,sub:'They move together. Alt+click one to work on it alone.'});}
function ungroupSel(){const objs=selObjs();const gs=new Set(objs.map(o=>o.g).filter(Boolean));if(!gs.size){toast('Nothing here is grouped');return;}
  let n=0;S.cur.objs.forEach(o=>{if(o.g&&gs.has(o.g)){delete o.g;n++;}});paintMsel();commit('Ungrouped '+n+' objects');toast('Ungrouped',{ok:true});}
/* ---- delete / duplicate / lock / order ---- */
function deleteSel(){const objs=selObjs();if(!objs.length)return;objs.forEach(o=>{removeMarker(o.id);if(S.editing===o.id)S.editing=null;});const ids=new Set(objs.map(o=>o.id));S.cur.objs=S.cur.objs.filter(o=>!ids.has(o.id));S.osel=null;S.msel=[];cleanGroups();renderObjects();layoutSheet();commit('Deleted '+objs.length+' objects');}
function dupSel(){const objs=selObjs().slice().sort((a,b)=>(a.z||0)-(b.z||0));if(!objs.length)return;const gm={},ids=[];
  objs.forEach(o=>{const c=JSON.parse(JSON.stringify(o));c.id=uid();c.x+=24;c.y+=24;c.z=nextZ();delete c.fa;delete c.dy;delete c.ax;delete c.sp;if(c.g)c.g=gm[c.g]||(gm[c.g]=uid());if(c.objs)c.objs.forEach(x=>x.id=uid());S.cur.objs.push(c);ids.push(c.id);});
  renderObjects();layoutSheet();selectIds(ids);ids.forEach(id=>{const c=OBJ(id);if(c)anchorObject(c);});commit('Duplicated '+ids.length+' objects');}
function lockSel(on){const objs=selObjs();objs.forEach(o=>{if(!!o.locked!==on)toggleLockObj(o);});renderObjects();layoutSheet();commit(on?'Locked objects':'Unlocked objects');}
function orderSel(front){const objs=selObjs().slice().sort((a,b)=>(a.z||0)-(b.z||0));if(!objs.length)return;
  if(front){const base=nextZ();objs.forEach((o,i)=>{o.z=base+i;});}else{const base=Math.min(...S.cur.objs.map(o=>o.z||0))-objs.length-1;objs.forEach((o,i)=>{o.z=base+i;});}
  renderObjects();commit(front?'Brought to front':'Sent to back');}
/* ---- align / distribute ---- */
function arranged(objs,label){const mov=objs.filter(o=>!o.locked);mov.forEach(o=>gapMoved(o));renderObjects();mov.forEach(o=>anchorObject(o));layoutSheet();paintMsel();commit(label);}
function alignSel(mode){const objs=selObjs();if(objs.length<2)return;const bx=objs.map(boxOf);
  const L=Math.min(...bx.map(b=>b.x)),R=Math.max(...bx.map(b=>b.x+b.w)),T=Math.min(...bx.map(b=>b.y)),B=Math.max(...bx.map(b=>b.y+b.h));
  objs.forEach((o,i)=>{if(o.locked)return;const b=bx[i];
    if(mode==='left')o.x=L;else if(mode==='center')o.x=Math.max(0,Math.round((L+R)/2-b.w/2));else if(mode==='right')o.x=Math.max(0,R-b.w);
    else if(mode==='top')o.y=T;else if(mode==='middle')o.y=Math.max(0,Math.round((T+B)/2-b.h/2));else if(mode==='bottom')o.y=Math.max(0,B-b.h);});
  arranged(objs,'Aligned '+mode);}
function distSel(axis){const objs=selObjs();if(objs.length<3){toast('Pick at least 3 objects to space them evenly');return;}const hz=axis==='h';
  const q=objs.map(o=>({o,b:boxOf(o)})).sort((a,b)=>hz?a.b.x-b.b.x:a.b.y-b.b.y);const f=q[0].b,l=q[q.length-1].b;

/* ---- right-click menu ---- */
function multiCtx(o,e){let ids=S.msel;if(!ids.includes(o.id)){if(!o.g)return false;const ms=groupOf(o);if(ms.length<2)return false;selectIds(ms.map(x=>x.id));}
  showMenu(multiMenu(),e.clientX,e.clientY);return true;}
function multiMenu(){const objs=selObjs(),n=objs.length;const gs=objs.map(o=>o.g);const anyG=gs.some(Boolean),oneG=anyG&&gs.every(g=>g===gs[0]);const allLocked=objs.every(o=>o.locked);
  const it=[{sub:n+' objects selected'}];

    {sub:'Space evenly'},{l:'Across (left to right)',disabled:n<3,fn:()=>distSel('h')},{l:'Down (top to bottom)',disabled:n<3,fn:()=>distSel('v')},{sep:1},
    {l:allLocked?'Unlock all':'Lock all',ic:allLocked?'unlock':'lock',fn:()=>lockSel(!allLocked)},{l:'Bring to front',ic:'front',fn:()=>orderSel(true)},{l:'Send to back',ic:'back',fn:()=>orderSel(false)},{l:'Duplicate',ic:'copy',k:'Ctrl D',fn:dupSel},{sep:1},{l:'Delete',ic:'trash',k:'Del',fn:deleteSel});
